# Tmux Configuration for Development Environment
# Designed for efficient remote server, Docker, and cloud infrastructure work

# ============================================================================
# General Settings
# ============================================================================

# Use C-a as prefix (easier to reach than C-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 50000

# Enable mouse support for easier navigation
set -g mouse on

# Set default terminal to support 256 colors
set -g default-terminal "screen-256color"

# Faster command sequences (reduce escape time)
set -s escape-time 0

# Increase display time for messages
set -g display-time 2000

# Enable focus events for better editor integration
set -g focus-events on

# Aggressive resize for multi-client scenarios
setw -g aggressive-resize on

# ============================================================================
# Key Bindings
# ============================================================================

# Reload configuration file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Create new window in current path
bind c new-window -c "#{pane_current_path}"

# Navigate panes with vim-like keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim-like keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window selection
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Toggle pane synchronization (useful for running commands on multiple panes)
bind S setw synchronize-panes

# Copy mode with vi keybindings
setw -g mode-keys vi
bind [ copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind ] paste-buffer

# Quick pane layout switching
bind Space next-layout

# ============================================================================
# Status Bar Configuration
# ============================================================================

# Enable status bar
set -g status on

# Update status bar every 5 seconds
set -g status-interval 5

# Center window list
set -g status-justify centre

# Status bar colors
set -g status-style bg=colour235,fg=colour249

# Left status: session name and window count
set -g status-left-length 40
set -g status-left "#[fg=colour39,bold]❐ #S #[fg=colour245]| #I:#P "

# Right status: hostname, load average, date/time
set -g status-right-length 80
set -g status-right "#[fg=colour245]%Y-%m-%d #[fg=colour39,bold]%H:%M #[fg=colour245]| #[fg=colour39,bold]#h "

# Window status format
setw -g window-status-format "#[fg=colour245] #I:#W "
setw -g window-status-current-format "#[fg=colour39,bold] #I:#W "

# Pane border colors
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# Message colors
set -g message-style bg=colour235,fg=colour39,bold

# ============================================================================
# Persistent Sessions
# ============================================================================

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# Set window titles automatically
set -g set-titles on
set -g set-titles-string "#S: #W"

